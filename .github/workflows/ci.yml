name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # fork pull requests never run on the persistent runners
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'synology' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - id: gate
        run: python3 scripts/preflight/classify.py gate
      - run: GOWORK=off go test ./...
        if: steps.gate.outputs.run_full == 'true'
      - run: GOWORK=off go vet ./...
        if: steps.gate.outputs.run_full == 'true'
      - run: python3 -m unittest discover -s scripts/tests -p driver_imports_test.py -v
        if: steps.gate.outputs.run_full == 'true'
        env:
          GOWORK: 'off'
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: 'local'
          GOFLAGS: -buildvcs=false
